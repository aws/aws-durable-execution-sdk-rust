AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Smoke)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  Hello:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/hello/
      Handler: bootstrap
      Description: Smoke test - minimal durable handler that returns immediately
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
