    TestingMetadata:
      TestDescription: ["3-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error/
      Handler: bootstrap
      Description: 'Conformance 3-4: child step failure (no retry)'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorCaught:
