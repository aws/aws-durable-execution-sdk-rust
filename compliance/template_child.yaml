      RetentionInDays: 7

  ChildStepWaitAfter:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_step_wait_after/
      Handler: bootstrap
