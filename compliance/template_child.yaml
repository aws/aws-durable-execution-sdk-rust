    TestingMetadata:
      TestDescription: ["3-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_nested/
      Handler: bootstrap
      Description: 'Conformance 3-6: nested child contexts'
      Role:
        Fn::GetAtt:
