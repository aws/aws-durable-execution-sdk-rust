AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Child Context)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - AttemptsTable
              - Arn

  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ChildBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_basic/
      Handler: bootstrap
      Description: 'Conformance 3-1: child context basic'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_with_name/
      Handler: bootstrap
      Description: 'Conformance 3-2: named child context'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildMultipleSteps:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_multiple_steps/
      Handler: bootstrap
      Description: 'Conformance 3-3: child with multiple steps'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildError:
