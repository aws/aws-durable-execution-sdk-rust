    TestingMetadata:
      TestDescription: ["3-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error_caught/
      Handler: bootstrap
      Description: 'Conformance 3-5: child error caught, execution continues'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNested:
