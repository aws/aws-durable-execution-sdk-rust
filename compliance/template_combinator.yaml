AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Combinator)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  CombinatorTryJoinAll:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["13-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/combinator_try_join_all/
      Handler: bootstrap
      Description: 'Conformance 13-1: try_join_all task ownership'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  CombinatorJoinAll:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["13-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/combinator_join_all/
      Handler: bootstrap
      Description: 'Conformance 13-2: join_all settled outcomes are genuine'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  CombinatorSelectOk:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["13-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/combinator_select_ok/
      Handler: bootstrap
      Description: 'Conformance 13-3: select_ok task ownership'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  CombinatorRace:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["13-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/combinator_race/
      Handler: bootstrap
      Description: 'Conformance 13-4: race task ownership'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
