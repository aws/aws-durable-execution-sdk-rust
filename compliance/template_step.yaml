    Properties:
      CodeUri: publish/step_with_error/
      Handler: bootstrap
      Description: 'Conformance 1-19: step with error'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepErrorCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-20"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_error_caught/
      Handler: bootstrap
