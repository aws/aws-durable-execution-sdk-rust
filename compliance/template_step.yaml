      CodeUri: publish/step_retry_specific_exception/
      Handler: bootstrap
      Description: 'Conformance 1-15: retry specific exception'
      Role: !Ref ExecutionRoleArn
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Fn::Sub: '${AWS::StackName}-Attempts'
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepRetryNonRetryable:
    Type: AWS::Serverless::Function
    TestingMetadata:
