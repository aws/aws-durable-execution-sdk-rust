AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Step)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: '${AWS::StackName}-Attempts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH

  StepBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_basic/
      Handler: bootstrap
      Description: 'Conformance 1-1: step basic'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_with_name/
      Handler: bootstrap
      Description: 'Conformance 1-2: step with name'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_nested/
      Handler: bootstrap
      Description: 'Conformance 1-3: sequential steps'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepComplexObject:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_complex_object/
      Handler: bootstrap
      Description: 'Conformance 1-4: complex object'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepNullResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_null_result/
      Handler: bootstrap
      Description: 'Conformance 1-5: null result'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepCustomSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_custom_serdes/
      Handler: bootstrap
      Description: 'Conformance 1-6: custom serdes'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepLogging:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_logging/
      Handler: bootstrap
      Description: 'Conformance 1-7: logging'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepLoggingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: '/aws/lambda/${StepLogging}'
      RetentionInDays: 7

  StepAndWaitReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_and_wait_replay/
      Handler: bootstrap
      Description: 'Conformance 1-8: step and wait replay'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
