  StepWithRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_with_retry/
      Handler: bootstrap
      Description: 'Conformance 1-11: step with retry'
      Role: !Ref ExecutionRoleArn
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Fn::Sub: '${AWS::StackName}-Attempts'
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepRetryExhaustion:
