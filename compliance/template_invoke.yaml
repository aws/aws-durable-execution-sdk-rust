      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME_1: !Sub "${TargetEcho.Arn}:$LATEST"
          TARGET_FUNCTION_NAME_2: !Sub "${TargetEcho.Arn}:$LATEST"

  InvokeCustomPayloadSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["5-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_custom_payload_serdes/
      Handler: bootstrap
      Description: Invoke with custom payload serdes
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
