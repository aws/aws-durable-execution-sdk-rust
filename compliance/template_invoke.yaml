  InvokeThenStep:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["5-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_then_step/
      Handler: bootstrap
      Description: Invoke then step
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${TargetEcho.Arn}:$LATEST"

  InvokeInChildContext:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["5-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_in_child_context/
      Handler: bootstrap
      Description: Invoke inside child context
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${TargetEcho.Arn}:$LATEST"

  InvokeMultipleSequential:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["5-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_multiple_sequential/
      Handler: bootstrap
