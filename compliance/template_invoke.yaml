          TARGET_FUNCTION_NAME: !Sub "${TargetError.Arn}:$LATEST"

  StepThenInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["5-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_then_invoke/
