[workspace]
# The telemetry exporter is its OWN cargo workspace, like conformance/ and
# examples/. The root workspace's direct-dependency allowlist
# (scripts/check-direct-deps.sh) covers every root member, and this crate's
# `cloudwatch-logs` and `http` features depend on aws-sdk-cloudwatchlogs and
# the aws-smithy HTTP crates, which are not on that list. A separate
# workspace keeps the SDK's dependency graph unchanged.
members = ["."]
resolver = "2"

[package]
name = "aws-durable-execution-sdk-telemetry-exporter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Durable Execution Telemetry plugin for the AWS Lambda Durable Functions Rust SDK"
repository = "https://github.com/aws/aws-durable-execution-sdk-rust"
readme = "README.md"
keywords = ["aws", "lambda", "durable-execution", "telemetry"]
publish = false

[lib]
name = "aws_durable_execution_sdk_telemetry_exporter"

# The same lint policy as the SDK's root workspace.
[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
cargo_common_metadata = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "deny"
unused_qualifications = "warn"
unsafe_code = "forbid"

[lints]
workspace = true

# An exporter that needs a service client is behind its own feature, and no
# feature is on by default. So a build compiles a service client only for
# an exporter that the build enables.
[features]
# Enables `CloudWatchLogsExporter`.
cloudwatch-logs = ["dep:aws-config", "dep:aws-sdk-cloudwatchlogs"]
# Enables `HttpExporter`.
http = ["http-client"]
# Compiles the private HTTP sender in `src/http.rs`. It is not part of the
# public API. An exporter that sends HTTP requests lists this feature, and no
# other change enables the sender.
http-client = [
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
    "tokio/time",
]

[dependencies]
aws-durable-execution-sdk = { path = ".." }
# The same trim as the SDK's own AWS crates: no legacy hyper-0.14 /
# rustls-0.21 chain. See the root Cargo.toml.
aws-config = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-cloudwatchlogs = { version = "1", optional = true, default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
# The HTTP sender uses the same TLS stack as the AWS crates above:
# `rustls` with `aws-lc`, the stack that their `default-https-client`
# feature selects.
aws-smithy-http-client = { version = "1", optional = true, default-features = false, features = [
    "rustls-aws-lc",
    "rt-tokio",
] }
aws-smithy-runtime-api = { version = "1", optional = true, default-features = false, features = [
    "client",
    "http-1x",
] }
aws-smithy-types = { version = "1", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
aws-durable-execution-sdk = { path = "..", features = ["test-util"] }
# The CloudWatch Logs exporter tests mock the service client at the HTTP
# layer. `mock_client!` requires the service crate's `test-util` feature.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = [
    "test-util",
] }
aws-smithy-mocks = "0.3"
# Installs a test's tracing subscriber so that it receives an event
# whichever thread reached the event's callsite first.
test-tracing = { path = "../test-support/test-tracing" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
