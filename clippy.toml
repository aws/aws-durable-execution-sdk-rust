# Bare `tokio::spawn` escapes the SDK's task-ownership registry and
# suspension-scope accounting: a future spawned outside the spawn
# abstraction in src/future.rs runs on a task whose ID the ownership
# detector has not blessed, so any durable operation it creates is
# rejected at run time, and a task the accounting cannot see can strand a
# suspension scope. The lint makes every bare spawn a compile-time
# decision: production code carries exactly one `#[expect]`, on the
# `spawn_raw` helper in src/future.rs that both `spawn_blessed` (owned,
# accounted tasks) and `spawn_detached` (internal bookkeeping tasks) route
# through, and tests that deliberately simulate foreign tasks carry their
# own with a reason.
disallowed-methods = [
    { path = "tokio::task::spawn", reason = "bare tokio::spawn bypasses task-ownership and suspension accounting; spawn through the src/future.rs spawn abstraction (spawn_blessed / spawn_detached)" },
]
