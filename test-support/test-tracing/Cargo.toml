[package]
name = "test-tracing"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Thread-default tracing captures for the SDK's tests"
repository = "https://github.com/aws/aws-durable-execution-sdk-rust"
publish = false

# The workspace lints, except `unsafe_code`: the code that `ctor` generates
# for the pre-main initializer allows `unsafe_code`, which a `forbid` level
# rejects, so this crate denies it instead.
[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
cargo_common_metadata = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "deny"
unused_qualifications = "warn"
unsafe_code = "deny"

[dependencies]
ctor = "1"
tracing = "0.1"
