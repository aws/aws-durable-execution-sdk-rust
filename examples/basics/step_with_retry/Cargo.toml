[package]
name = "step_with_retry"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: step with a retry strategy and step semantics"

[[bin]]
name = "step_with_retry"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
