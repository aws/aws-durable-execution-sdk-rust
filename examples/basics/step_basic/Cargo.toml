[package]
name = "step_basic"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: checkpoint a single step"

[[bin]]
name = "step_basic"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
