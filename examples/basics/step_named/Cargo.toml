[package]
name = "step_named"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: name a step for observability, using typed input"

[[bin]]
name = "step_named"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
