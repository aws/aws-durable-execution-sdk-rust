[package]
name = "step_default_semantics"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: async default step semantics with an at-least-once key step"

[[bin]]
name = "step_default_semantics"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
aws-durable-execution-sdk = { path = "../../..", features = ["test-util"] }
