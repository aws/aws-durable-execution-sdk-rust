AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Examples - Rust (external, serdes & cross-cutting family)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128
    Architectures:
    - x86_64

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            - lambda:InvokeFunction
            - lambda:SendDurableExecutionCallbackSuccess
            - lambda:SendDurableExecutionCallbackFailure
            - lambda:SendDurableExecutionCallbackHeartbeat
            Resource: '*'

  # ---- chained-invoke companion targets (callees) ----

  InvokeTarget:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_target/
      Handler: bootstrap
      Description: 'Companion: echo target for chained invoke'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  InvokeTargetTenant:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_target_tenant/
      Handler: bootstrap
      Description: 'Companion: tenant-isolated echo target for chained invoke'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      TenancyConfig:
        TenantIsolationMode: PER_TENANT
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- invoke ----

  InvokeSimple:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_simple/
      Handler: bootstrap
      Description: 'Example: chained durable invocation of another function'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${InvokeTarget.Arn}:$LATEST"

  InvokeTenantId:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/invoke_tenant_id/
      Handler: bootstrap
      Description: 'Example: chained invoke scoped to a tenant'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${InvokeTargetTenant.Arn}:$LATEST"

  # ---- create_callback ----

  CreateCallbackSimple:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/create_callback_simple/
      Handler: bootstrap
      Description: 'Example: create a callback and await external completion'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  CreateCallbackHeartbeat:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/create_callback_heartbeat/
      Handler: bootstrap
      Description: 'Example: create a callback with heartbeat keepalive'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  CreateCallbackTimeout:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/create_callback_timeout/
      Handler: bootstrap
      Description: 'Example: create a callback with a timeout, caught'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- wait_for_callback ----

  WaitForCallbackBasic:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_callback_basic/
      Handler: bootstrap
      Description: 'Example: wait_for_callback with a no-op submitter'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForCallbackSubmitter:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_callback_submitter/
      Handler: bootstrap
      Description: 'Example: wait_for_callback with a submitter and retry'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForCallbackTimeout:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_callback_timeout/
      Handler: bootstrap
      Description: 'Example: wait_for_callback with a timeout, caught'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- wait_for_condition ----

  WaitForCondition:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition/
      Handler: bootstrap
      Description: 'Example: poll a condition with a bounded wait strategy'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- serdes ----

  SerdeBasic:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/serde_basic/
      Handler: bootstrap
      Description: 'Example: custom Serdes on an operation'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  SerdeConfigure:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/serde_configure/
      Handler: bootstrap
      Description: 'Example: a default Serdes for the whole execution via Options'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  LargePayload:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/large_payload/
      Handler: bootstrap
      Description: 'Example: FileSystemSerdes overflow for large payloads'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- logging ----

  LoggingLevels:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/logging_levels/
      Handler: bootstrap
      Description: 'Example: structured logging at multiple levels via tracing'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  LoggingAfterWait:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/logging_after_wait/
      Handler: bootstrap
      Description: 'Example: replay-suppressed logging after a durable wait'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # ---- cross-cutting ----

  Comprehensive:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/comprehensive/
      Handler: bootstrap
      Description: 'Example: capstone exercising every core operation'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${InvokeTarget.Arn}:$LATEST"

  ErrorDeterminism:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/error_determinism/
      Handler: bootstrap
      Description: 'Example: the determinism contract in practice'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  NoReplayExecution:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/no_replay_execution/
      Handler: bootstrap
      Description: 'Example: is_replaying() to guard non-durable side effects'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  OptionalResults:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/optional_results/
      Handler: bootstrap
      Description: 'Example: unit and Option results (JS undefined analogue)'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  RetryExhaustion:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/retry_exhaustion/
      Handler: bootstrap
      Description: 'Example: retry until the strategy stops, then recover'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  HandlerError:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/handler_error/
      Handler: bootstrap
      Description: 'Example: an error returned from the handler fails the execution'
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
