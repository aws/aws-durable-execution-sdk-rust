[package]
name = "large_payload"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: FileSystemSerdes overflow for large payloads"

[[bin]]
name = "large_payload"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
