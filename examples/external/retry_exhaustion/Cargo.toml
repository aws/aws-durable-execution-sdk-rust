[package]
name = "retry_exhaustion"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: retry until the strategy stops, then recover"

[[bin]]
name = "retry_exhaustion"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
