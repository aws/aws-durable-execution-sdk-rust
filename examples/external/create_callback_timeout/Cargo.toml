[package]
name = "create_callback_timeout"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: create a callback with a timeout, caught"

[[bin]]
name = "create_callback_timeout"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
