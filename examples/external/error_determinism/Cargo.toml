[package]
name = "error_determinism"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: the determinism contract in practice"

[[bin]]
name = "error_determinism"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
