[package]
name = "wait_for_callback_basic"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: wait_for_callback with a no-op submitter"

[[bin]]
name = "wait_for_callback_basic"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
