[package]
name = "no_replay_execution"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: is_replaying() to guard non-durable side effects"

[[bin]]
name = "no_replay_execution"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
