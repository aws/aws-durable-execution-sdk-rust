[package]
name = "logging_after_wait"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: replay-suppressed logging after a durable wait"

[[bin]]
name = "logging_after_wait"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../..", features = ["replay-filter"] }
lambda_runtime = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
