[package]
name = "map_concurrency"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: map with bounded max_concurrency"

[[bin]]
name = "map_concurrency"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk-rust = { path = "../../.." }
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
