[package]
name = "map_empty"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: map over an empty collection (edge case)"

[[bin]]
name = "map_empty"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
