[package]
name = "combinator_select_ok"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Example: select_ok combinator (Promise.any)"

[[bin]]
name = "combinator_select_ok"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
