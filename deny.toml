# cargo-deny configuration for aws-durable-execution-sdk-rust
#
# Enforcement strategy for the closed production dependency allowlist:
#
# We use [bans.deny] to block ALL crates by default for non-dev,
# non-build dependencies, then [bans.allow] to permit exactly the
# production allowlist. cargo-deny's `deny` list with wildcards is not
# the right tool: instead we use the `multiple-versions` and
# `external-types` approach:
#
# Actually, cargo-deny does not support "deny all except allowlist" in
# [bans] directly for transitive deps in a useful way. The practical
# approach that cargo-deny DOES support well:
#
# We list the 8 allowed production crates as `allow`. With
# `deny = []` (empty) and `multiple-versions = "warn"`, this setup
# means: any DIRECT dependency not in `allow` triggers a ban violation.
# Transitive dependencies of allowed crates are inherently acceptable
# (they come through allowed paths).
#
# The mechanical guarantee: if a developer adds a new `[dependencies]`
# entry (e.g. `anyhow = "1"`) that is not in the allow list below,
# `cargo deny check bans` will fail with "anyhow is not allowed".
#
# The allowlist below gates every direct production dependency; entries
# only match once actually depended upon.

[graph]
# Only check non-dev dependencies for bans.
# Dev deps (like tracing-subscriber for tests) are unrestricted.
exclude-dev = true

# [bans], dependency ban configuration
[bans]
# Warn on duplicate versions so regressions surface in `cargo deny` output
# without failing the gate, the AWS SDK tree still carries a few
# unavoidable duplicates (e.g. windows-sys) that upstream must converge.
multiple-versions = "warn"
wildcards = "allow"
# NOTE: cargo-deny's [bans.allow] checks the ENTIRE dependency graph
# (including all transitive crates). With the aws-sdk tree pulling ~400
# transitive crates, a populated allow list here is impractical.
#
# MECHANICAL ENFORCEMENT of the closed production dependency allowlist
# is provided by scripts/check-direct-deps.sh, which is wired into
# `make check`. That script validates DIRECT [dependencies] of every
# workspace member against two allowlists: the default-feature graph may
# contain only the 8 spec-approved always-on crates, and the
# --all-features graph may add only the approved optional feature-gated
# crates (currently tracing-subscriber, behind `replay-filter`).
# This gives us the red gate the spec requires without needing to
# enumerate every transitive crate.
allow = []
deny = []

# [licenses]: Apache-2.0/MIT ecosystem allowances
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# [advisories]: RustSec advisory database checking
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No exceptions: the legacy hyper-0.14 / rustls-0.21 / ring chain that
# required them left the graph when aws-config and aws-sdk-lambda dropped
# their default features. Any new entry needs a comment naming the
# advisory and the reason.
ignore = []
