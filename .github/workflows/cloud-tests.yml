name: Cloud tests

# Deploys the three example family stacks with SAM into the test account,
# then invokes every directly-invokable example and asserts its durable
# execution reaches the terminal state documented in examples/README.md
# (harness: examples/cloud/run_cloud_tests.sh). Stacks are torn down even
# when the tests fail.

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running cloud tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}
  STACK_BASICS: rust-examples-ci-basics
  STACK_COORDINATION: rust-examples-ci-coordination
  STACK_EXTERNAL: rust-examples-ci-external

permissions:
  contents: read

jobs:
  example-tests:
    name: example-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    concurrency:
      group: rust-cloud-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: examples

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The single build path, identical to the one a maintainer runs locally.
      # cargo-lambda pins the glibc version the examples link against so they
      # start on the provided.al2023 runtime (glibc 2.34); a plain `cargo
      # build` on this runner produces binaries that require GLIBC_2.39 and
      # die at startup. See examples/build_examples.sh for the full note.
      - name: Install cargo-lambda
        run: pip install "cargo-lambda==1.8.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: rustExamplesGitHubCloudTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Build examples
        working-directory: examples
        run: ./build_examples.sh

      - name: Deploy example stacks with SAM
        working-directory: examples
        env:
          EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          deploy_family() {
            family=$1
            stack=$2
            sam build --template-file "template_${family}.yaml" \
              --build-dir ".aws-sam/build-${family}"
            sam deploy \
              --template-file ".aws-sam/build-${family}/template.yaml" \
              --stack-name "$stack" \
              --resolve-s3 \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --region "$AWS_REGION" \
              --parameter-overrides ExecutionRoleArn="$EXECUTION_ROLE_ARN"
          }
          deploy_family basics "$STACK_BASICS"
          deploy_family coordination "$STACK_COORDINATION"
          deploy_family external "$STACK_EXTERNAL"

      - name: Run cloud tests
        working-directory: examples
        run: ./cloud/run_cloud_tests.sh

      - name: Tear down example stacks
        if: always()
        run: |
          for stack in "$STACK_BASICS" "$STACK_COORDINATION" "$STACK_EXTERNAL"; do
            echo "Deleting stack $stack"
            aws cloudformation delete-stack --stack-name "$stack" || true
          done
          for stack in "$STACK_BASICS" "$STACK_COORDINATION" "$STACK_EXTERNAL"; do
            aws cloudformation wait stack-delete-complete --stack-name "$stack" || true
          done
