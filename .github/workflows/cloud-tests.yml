name: Cloud tests

# Deploys the three example family stacks with SAM into the test account,
# then invokes every directly-invokable example and asserts its durable
# execution reaches the terminal state documented in examples/README.md
# (harness: examples/cloud/run_cloud_tests.sh). Stacks are torn down even
# when the tests fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running cloud tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}
  # The stacks are rust-examples-ci-<family>; the concurrency group below
  # keeps two runs from sharing them.
  RUN_ID: ci

permissions:
  contents: read

jobs:
  example-tests:
    name: example-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    concurrency:
      group: rust-cloud-tests
      cancel-in-progress: false
    env:
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: examples

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The single build path, identical to the one a maintainer runs locally.
      # cargo-lambda pins the glibc version the examples link against so they
      # start on the provided.al2023 runtime (glibc 2.34); a plain `cargo
      # build` on this runner produces binaries that require GLIBC_2.39 and
      # die at startup. See examples/build_examples.sh for the full note.
      - name: Install cargo-lambda
        run: pip install "cargo-lambda==1.8.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: rustExamplesGitHubCloudTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      # Checks the account, builds the examples, deploys the three family
      # stacks, runs examples/cloud/run_cloud_tests.sh, and deletes the
      # stacks.
      - name: Build, deploy, test, tear down
        run: make cloud-tests

      # A cancelled job never reaches the cleanup of the step above.
      - name: Tear down example stacks
        if: always()
        run: sh scripts/cloud-tests.sh teardown
