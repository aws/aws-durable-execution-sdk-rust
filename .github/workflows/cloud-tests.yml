name: Cloud tests

# Deploys the three example family stacks with SAM into the test account,
# then invokes every directly-invokable example and asserts its durable
# execution reaches the terminal state documented in examples/README.md
# (harness: examples/cloud/run_cloud_tests.sh). Stacks are torn down even
# when the tests fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running cloud tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}
  # The stacks are rust-examples-ci-<family>; the concurrency group below
  # keeps two runs from sharing them.
  RUN_ID: ci

# One run at a time holds the group, from the test job through the
# teardown job, so a run's stacks are deleted before the next run deploys
# stacks of the same names. A fork or Dependabot pull request skips every
# job, so its run takes a group of its own and cannot cancel a run that
# waits for the group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && format('rust-cloud-tests-skipped-{0}', github.run_id) || 'rust-cloud-tests' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  example-tests:
    name: example-tests
    # Fork and Dependabot pull requests skip the job: it needs the test
    # account's secrets and OIDC credentials, which those runs cannot read.
    if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    # CodeBuild-hosted runner: the CodeBuild project github-actions-runner,
    # one fresh container per job, 60-minute build limit. The label must
    # match the project name.
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    # Below the 60-minute build limit with room for the teardown step
    # (under 4 minutes), so GitHub ends a stuck job and the step deletes
    # the stacks before CodeBuild stops the runner. The teardown job below
    # deletes them when the runner stops anyway.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    env:
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The single build path, identical to the one a maintainer runs locally.
      # cargo-lambda pins the glibc version the examples link against so they
      # start on the provided.al2023 runtime (glibc 2.34); a plain `cargo
      # build` on an ubuntu-latest runner produces binaries that require
      # GLIBC_2.39 and die at startup. See examples/build_examples.sh for the
      # full note.
      - name: Install cargo-lambda
        run: pip install "cargo-lambda==1.8.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: rustExamplesGitHubCloudTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      # Checks the account, builds the examples, deploys the three family
      # stacks, runs examples/cloud/run_cloud_tests.sh, and deletes the
      # stacks.
      - name: Build, deploy, test, tear down
        run: make cloud-tests

      # A cancelled job never reaches the cleanup of the step above.
      - name: Tear down example stacks
        if: always()
        run: sh scripts/cloud-tests.sh teardown

  # Deletes the stacks again by name on a fresh runner. The test job's own
  # teardown cannot run when CodeBuild stops its runner (at the 60-minute
  # build limit, or when the container is lost), and this job still runs
  # then. It runs after the test job in every run that does not skip it,
  # and finds nothing to delete when the test job deleted the stacks.
  teardown:
    name: delete example stacks
    needs: example-tests
    if: always() && (github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    env:
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: rustExamplesGitHubCloudTestTeardown
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete the example stacks
        run: sh scripts/cloud-tests.sh teardown
