name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info in the dev profile inflates target/ by gigabytes and has
  # exhausted the runner's disk in the examples build; nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Every command step calls a make target, and the Makefile holds the
  # commands, so `make ci` runs locally what these jobs run. `make check` is
  # this job, the `dependencies` job and the `msrv` job.
  check:
    name: check (sdk)
    # Pushes and same-repository pull requests run on the CodeBuild-hosted
    # runner: the CodeBuild project github-actions-runner, one fresh
    # container per job, 60-minute build limit. The label must match the
    # project name. Fork and Dependabot pull requests run on ubuntu-latest,
    # so the build scripts and procedural macros of a dependency update do
    # not run in the CodeBuild account before a maintainer reviews them.
    # This is routing, not a trust boundary: for forks, the boundary is the
    # repository's approval setting for fork pull request workflows.
    #
    # This job alone asks for the large instance (16 GiB, as ubuntu-latest
    # has): one rustc compiling the SDK's unit tests peaks above 7 GiB, and
    # on the project's default instance the kernel killed it.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}-large', github.run_id, github.run_attempt) }}
    # Below the 60-minute build limit, so GitHub ends a stuck job and
    # reports it, rather than CodeBuild stopping the runner.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Format, clippy, tests, docs, MSRV declaration consistency
        run: make check-sdk

  # Verify the declared minimum supported Rust version (rust-version in
  # Cargo.toml) actually compiles the crate. Without this leg the true MSRV
  # can silently drift above the declared one, and the rust-version field
  # would then be wrong rather than protective.
  msrv:
    name: check (msrv 1.94.1)
    # Same routing and timeout as the check job, on the default instance.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Check on MSRV
        run: make msrv

  # Dependency policy: advisories, bans, licenses, sources, plus the
  # direct-dependency allowlist that keeps the production graph closed.
  dependencies:
    name: dependencies
    # Same routing and timeout as the check job, on the default instance.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny and the direct dependency allowlist
        run: make dependencies

  # Public API surface: no foreign type may appear in the public API unless
  # the allowlist in Cargo.toml ([package.metadata.cargo_check_external_types])
  # names it deliberately. This is the mechanical guard that would have
  # caught #37 (serde_json::Value in the Serdes signature) and #38
  # (SdkConfig/Client public but not re-exported). See issue #39.
  #
  # cargo-check-external-types reads rustdoc's unstable JSON output, so each
  # release pins an exact nightly; 0.5.0 pins nightly-2026-03-20. Bump the
  # two together, here and in scripts/tools.sh.
  external-types:
    name: public API (external types)
    # Same routing and timeout as the check job, on the default instance.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-20 --profile minimal
          rustup default nightly-2026-03-20
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      # No prebuilt distribution exists for this tool, so cache the compiled
      # binary; the key ties it to the tool version and the pinned nightly.
      - name: Cache cargo-check-external-types
        id: cache-cet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-check-external-types
          key: cargo-check-external-types-0.5.0-nightly-2026-03-20

      - name: Install cargo-check-external-types
        if: steps.cache-cet.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-check-external-types --version 0.5.0

      # The Makefile clears the workflow-wide RUSTFLAGS for this command.
      - name: Check external types in public API
        run: make external-types

  # Feature combinations: every set in the feature powerset must compile, so
  # `--no-default-features` and `--features test-util` are both proven to
  # build rather than assumed to (issue #39).
  feature-powerset:
    name: feature powerset
    # Same routing and timeout as the check job, on the default instance.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-hack@0.6.45

      - name: Check the feature powerset
        run: make feature-powerset

  # The conformance handlers and examples are separate cargo workspaces with
  # heavier dependency graphs, deliberately outside the SDK's `make check`.
  # CI still compiles both so a public API change cannot silently break them.
  workspaces:
    name: build (${{ matrix.workspace }})
    # Same routing and timeout as the check job, on the default instance.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        workspace: [conformance, examples]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # These workspaces' dependency graphs fill the default runner disk
      # (the examples build has died linking with "no space left"); reclaim
      # the space taken by preinstalled toolchains we never use. Only the
      # GitHub-hosted image is short on disk; the CodeBuild image has a
      # large volume and a different package set.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        if: runner.environment == 'github-hosted'
        with:
          tool-cache: false

      - uses: ./.github/actions/ensure-rustup

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Build and clippy
        run: make workspaces WORKSPACES=${{ matrix.workspace }}
