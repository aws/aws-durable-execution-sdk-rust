AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (General)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  GeneralReplayOperationIdentity:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["11-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/general_replay_operation_identity/
      Handler: bootstrap
      Description: 'Conformance 11-1: replay rejects an operation-type mismatch'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
