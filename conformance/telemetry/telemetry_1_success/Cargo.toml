[package]
name = "telemetry_1_success"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Telemetry conformance handler: telemetry-1"


[[bin]]
name = "telemetry_1_success"
path = "src/main.rs"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
aws-durable-execution-sdk-telemetry-exporter = { path = "../../../telemetry-exporter" }
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
