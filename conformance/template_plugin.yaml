AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Plugin)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128

Resources:
  PluginInvocationLifecycle:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
      NotImplemented:
        - id: "10-19"
          reason: "InvocationEndInfo carries no first-invocation flag, as in the JS reference"
        - id: "10-23"
          reason: "OperationInfo passed to on_user_function_start has no children-replay indicator"
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_invocation_lifecycle/
      Handler: bootstrap
      Description: 'Conformance 10-1: Plugin invocation lifecycle hooks (start and end on a single invocation)'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginMultiplePlugins:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_multiple_plugins/
      Handler: bootstrap
      Description: 'Conformance 10-5: Multiple registered plugins all receive lifecycle hooks'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginFirstInvocationFlag:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_first_invocation_flag/
      Handler: bootstrap
      Description: 'Conformance 10-6: Plugin sees is-first-invocation true once, then false on replay'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginTerminalFailure:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_terminal_failure/
      Handler: bootstrap
      Description: 'Conformance 10-7: Plugin invocation-end hook receives FAILED status when execution fails'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginExternalUpdateOnInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_external_update_on_invoke/
      Handler: bootstrap
      Description: 'Conformance 10-9: Plugin sees a wait completed externally between invocations as an updated operation'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginSuspensionInvocationEnd:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_suspension_invocation_end/
      Handler: bootstrap
      Description: 'Conformance 10-16: Invocation-end fires for every invocation, non-terminal on suspension and terminal at completion'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginOperationLifecycle:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_operation_lifecycle/
      Handler: bootstrap
      Description: 'Conformance 10-2: Plugin operation start and end hooks fire once for a step'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginAttemptHooksRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_attempt_hooks_retry/
      Handler: bootstrap
      Description: 'Conformance 10-3: Plugin attempt hooks fire per step attempt with attempt number and outcome'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginErrorIsolation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_error_isolation/
      Handler: bootstrap
      Description: 'Conformance 10-4: Plugin hook errors never affect the execution outcome'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginReplayFlags:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_replay_flags/
      Handler: bootstrap
      Description: 'Conformance 10-13: Plugin sees no hook for a terminal replayed step and a replay flag on a retried start'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginTerminalPayloads:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_terminal_payloads/
      Handler: bootstrap
      Description: 'Conformance 10-14: Plugin operation-end hook carries the result or the error of a terminal step'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_retry_exhaustion/
      Handler: bootstrap
      Description: 'Conformance 10-15: Plugin attempt and end hooks follow a step to retry exhaustion'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginFaultyAndHealthy:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_faulty_and_healthy/
      Handler: bootstrap
      Description: 'Conformance 10-17: A healthy plugin receives every hook beside a faulty one'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginOperationFieldShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-20"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_operation_field_shape/
      Handler: bootstrap
      Description: 'Conformance 10-20: Plugin operation infos carry every field in the canonical dump'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginOperationChange:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_operation_change/
      Handler: bootstrap
      Description: 'Conformance 10-8: Plugin operation-change hook reports the step change and the full operation map'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginChangeFieldShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-22"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_change_field_shape/
      Handler: bootstrap
      Description: 'Conformance 10-22: Plugin operation-change infos carry every field in the canonical dump'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginAttemptInfoShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-21"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_attempt_info_shape/
      Handler: bootstrap
      Description: 'Conformance 10-21: Plugin attempt infos carry every field in the canonical dump'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginWaitOperationHooks:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_wait_operation_hooks/
      Handler: bootstrap
      Description: 'Conformance 10-10: Plugin operation-start and operation-end hooks fire for wait-type operations'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginWaitReplayFlag:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_wait_replay_flag/
      Handler: bootstrap
      Description: 'Conformance 10-18: A wait still pending during a replay re-fires operation-start with replay=true'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginNestedParentLinkage:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_nested_parent_linkage/
      Handler: bootstrap
      Description: 'Conformance 10-11: Plugin operation end hook reports the parent ID of a step nested in a child context'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  PluginParallelBranchHooks:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/plugin_parallel_branch_hooks/
      Handler: bootstrap
      Description: 'Conformance 10-12: Plugin user-function hooks fire per parallel branch with parent linkage'
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
