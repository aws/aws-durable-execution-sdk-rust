AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Rust (Parallel)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 128

Resources:
  ParallelBasic:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription: ["8-1"]
    Properties:
      CodeUri: publish/parallel_basic/
      Handler: bootstrap
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

