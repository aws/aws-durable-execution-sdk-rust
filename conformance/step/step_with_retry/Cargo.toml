[package]
name = "step_with_retry"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Conformance handler: step_with_retry"


[[bin]]
name = "step_with_retry"
path = "src/main.rs"

[lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dependencies]
aws-durable-execution-sdk = { path = "../../.." }
conformance = { path = "../.." }
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
aws-config = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
