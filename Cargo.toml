[workspace]
# The conformance/ handlers form their OWN cargo workspace
# (conformance/Cargo.toml) so they build into a single shared target dir and
# carry their own fast-build [profile.release] tuning without touching the
# SDK's release profile. They are deliberately NOT members of this workspace:
# they pull a heavier dependency graph (aws-sdk-dynamodb) that has no business
# in the SDK's `make check`, so they build as separate workspaces.
members = ["."]

[package]
name = "aws-durable-execution-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Rust SDK for AWS Lambda Durable Functions"
publish = false

[lib]
name = "aws_durable_execution_sdk"

# Types from other crates that are deliberately part of this crate's public
# API. `cargo +nightly check-external-types` (wired into ci.yml) fails the
# build when a foreign type outside this list reaches the public surface,
# which is the mechanical guard against leaks like #37 (`serde_json::Value`
# in the `Serdes` signature) and #38 (`SdkConfig`/`Client` public but not
# re-exported). Keep this list minimal, and keep `serde_json` out of it:
# raw JSON values are an implementation detail (see `InvocationPayload` /
# `InvocationResponse`).
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # The serialization contract: handler events, outputs, and operation
    # payloads are bounded by serde's traits. serde re-exports them from
    # serde_core, and rustdoc records the defining crate, so both paths
    # are needed.
    "serde::*",
    "serde_core::*",
    # The Lambda runtime is the crate's execution substrate: the crate
    # re-exports it (`pub use lambda_runtime`), `run`/`wrap` speak its
    # `LambdaEvent`/`Error` types, and `DurableContext::lambda_context`
    # returns its `Context`.
    "lambda_runtime",
    "lambda_runtime::*",
    # `Options` accepts a caller-supplied SDK configuration or Lambda
    # client (both re-exported from the crate root; see #38).
    "aws_types::sdk_config::SdkConfig",
    "aws_sdk_lambda::client::Client",
    # The `replay-filter` feature exists to implement tracing-subscriber's
    # `Filter` trait, which necessarily names these types in the impl.
    "tracing_subscriber::layer::Filter",
    "tracing_subscriber::registry::LookupSpan",
    "tracing_core::subscriber::Subscriber",
]

# Non-default feature gating the in-process local testing runner
# (`test_util::LocalRunner`). Off by default so the always-on public API and
# dependency graph are unchanged; enable with `--features test-util`.
#
# `replay-filter` exports `ReplayFilterLayer`, a ready-made
# `tracing-subscriber` per-layer filter that suppresses replayed log events.
# Off by default so the production dependency graph stays at the eight
# allowlisted crates; enabling it pulls in `tracing-subscriber`.
[features]
test-util = []
replay-filter = ["dep:tracing-subscriber"]

# Workspace-level lints inherited by all members.
# Style precedence: rustfmt (definitional) > Rust API Guidelines > clippy judgment.
[workspace.lints.clippy]
all = "deny"
# Groups at lower priority so individual lint overrides take precedence.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow multiple versions of transitive dependencies: the AWS SDK
# ecosystem has not yet converged on single versions for all crates.
multiple_crate_versions = { level = "allow", priority = 1 }
# Panic-policy restriction lints (not covered by all/pedantic; added explicitly).
# A panic in the SDK kills the customer's Lambda invocation.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "deny"
unused_qualifications = "warn"
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
lambda_runtime = "1"
# Both AWS crates disable default features so the legacy hyper-0.14 /
# rustls-0.21 / ring chain never enters the graph. `default-https-client`
# selects the modern hyper-1 + rustls-0.23 (aws-lc-rs) client and
# `rt-tokio` supplies the async sleep/timeout implementation the default
# credentials chain and retry timers need. `behavior-version-latest` on
# aws-sdk-lambda lets `Client::new` accept a caller-supplied `SdkConfig`
# that carries no behavior version instead of panicking.
aws-config = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-lambda = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["registry"] }
sha2 = "0.10"

[dev-dependencies]
# Self dev-dependency: enables `test-util` whenever a dev target (unit,
# integration, or doc test) builds, so a plain `cargo test` runs the
# `LocalRunner`-based tests without `--features test-util`. Dev-only, so
# the feature never leaks into a consumer's default build.
aws-durable-execution-sdk = { path = ".", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
aws-smithy-runtime-api = { version = "1", features = ["http-1x"] }
aws-smithy-types = "1"
# Request-mapping tests mock the Lambda SDK client at the HTTP layer.
# `mock_client!` requires the service crate's `test-util` feature; keep
# default features off here so the dev graph matches the production one.
aws-smithy-mocks = "0.3"
aws-sdk-lambda = { version = "1", default-features = false, features = ["test-util"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[[test]]
name = "nondeterminism"
required-features = ["test-util"]

[[test]]
name = "serdes_async"
required-features = ["test-util"]

[[test]]
name = "replay_logging"
required-features = ["test-util", "replay-filter"]

[[test]]
name = "lifecycle_events"
required-features = ["test-util"]
