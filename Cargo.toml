[workspace]
# The conformance/ handlers form their OWN cargo workspace
# (conformance/Cargo.toml) so they build into a single shared target dir and
# carry their own fast-build [profile.release] tuning without touching the
# SDK's release profile. They are deliberately NOT members of this workspace:
# they pull a heavier dependency graph (aws-sdk-dynamodb) that has no business
# in the SDK's `make check`, so they build as separate workspaces.
members = ["."]

[package]
name = "aws-durable-execution-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Rust SDK for AWS Lambda Durable Functions"
repository = "https://github.com/aws/aws-durable-execution-sdk-rust"
readme = "README.md"
keywords = ["aws", "lambda", "durable-execution", "workflow"]

[lib]
name = "aws_durable_execution_sdk"

# Types from other crates that are deliberately part of this crate's public
# API. `cargo +nightly check-external-types` (wired into ci.yml) fails the
# build when a foreign type outside this list reaches the public surface,
# which is the mechanical guard against leaks like #37 (`serde_json::Value`
# in the `Serdes` signature) and #38 (`SdkConfig`/`Client` public but not
# re-exported). Keep this list minimal, and keep `serde_json` out of it:
# raw JSON values are an implementation detail (see `InvocationPayload` /
# `InvocationResponse`).
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # The serialization contract: handler events, outputs, and operation
    # payloads are bounded by serde's traits. serde re-exports them from
    # serde_core, and rustdoc records the defining crate, so both paths
    # are needed.
    "serde::*",
    "serde_core::*",
    # The Lambda runtime is the crate's execution substrate: the crate
    # re-exports it (`pub use lambda_runtime`), `run`/`wrap` speak its
    # `LambdaEvent`/`Error` types, and `DurableContext::lambda_context`
    # returns its `Context`.
    "lambda_runtime",
    "lambda_runtime::*",
    # `Options` accepts a caller-supplied SDK configuration or Lambda
    # client (both re-exported from the crate root; see #38).
    "aws_types::sdk_config::SdkConfig",
    "aws_sdk_lambda::client::Client",
    # The public transport trait (`ExecutionClient`) speaks these service
    # model types, re-exported from `lambda_types`: the types `Operation`
    # and `OperationUpdate` name in their fields, and their `DateTime`.
    # Each entry is the defining path the check reports.
    "aws_sdk_lambda::types::_callback_details::CallbackDetails",
    "aws_sdk_lambda::types::_callback_options::CallbackOptions",
    "aws_sdk_lambda::types::_chained_invoke_details::ChainedInvokeDetails",
    "aws_sdk_lambda::types::_chained_invoke_options::ChainedInvokeOptions",
    "aws_sdk_lambda::types::_context_details::ContextDetails",
    "aws_sdk_lambda::types::_context_options::ContextOptions",
    "aws_sdk_lambda::types::_error_object::ErrorObject",
    "aws_sdk_lambda::types::_execution_details::ExecutionDetails",
    "aws_sdk_lambda::types::_operation::Operation",
    "aws_sdk_lambda::types::_operation_action::OperationAction",
    "aws_sdk_lambda::types::_operation_status::OperationStatus",
    "aws_sdk_lambda::types::_operation_type::OperationType",
    "aws_sdk_lambda::types::_operation_update::OperationUpdate",
    "aws_sdk_lambda::types::_step_details::StepDetails",
    "aws_sdk_lambda::types::_step_options::StepOptions",
    "aws_sdk_lambda::types::_wait_details::WaitDetails",
    "aws_sdk_lambda::types::_wait_options::WaitOptions",
    "aws_smithy_types::date_time::DateTime",
    # The `test-util` history event model: `TestResult::history_events`
    # returns the service `Event`, re-exported from `lambda_types` with
    # every type it names in its fields, directly or nested.
    "aws_sdk_lambda::types::_callback_failed_details::CallbackFailedDetails",
    "aws_sdk_lambda::types::_callback_started_details::CallbackStartedDetails",
    "aws_sdk_lambda::types::_callback_succeeded_details::CallbackSucceededDetails",
    "aws_sdk_lambda::types::_callback_timed_out_details::CallbackTimedOutDetails",
    "aws_sdk_lambda::types::_chained_invoke_failed_details::ChainedInvokeFailedDetails",
    "aws_sdk_lambda::types::_chained_invoke_started_details::ChainedInvokeStartedDetails",
    "aws_sdk_lambda::types::_chained_invoke_stopped_details::ChainedInvokeStoppedDetails",
    "aws_sdk_lambda::types::_chained_invoke_succeeded_details::ChainedInvokeSucceededDetails",
    "aws_sdk_lambda::types::_chained_invoke_timed_out_details::ChainedInvokeTimedOutDetails",
    "aws_sdk_lambda::types::_context_failed_details::ContextFailedDetails",
    "aws_sdk_lambda::types::_context_started_details::ContextStartedDetails",
    "aws_sdk_lambda::types::_context_succeeded_details::ContextSucceededDetails",
    "aws_sdk_lambda::types::_event::Event",
    "aws_sdk_lambda::types::_event_error::EventError",
    "aws_sdk_lambda::types::_event_input::EventInput",
    "aws_sdk_lambda::types::_event_result::EventResult",
    "aws_sdk_lambda::types::_event_type::EventType",
    "aws_sdk_lambda::types::_execution_failed_details::ExecutionFailedDetails",
    "aws_sdk_lambda::types::_execution_started_details::ExecutionStartedDetails",
    "aws_sdk_lambda::types::_execution_stopped_details::ExecutionStoppedDetails",
    "aws_sdk_lambda::types::_execution_succeeded_details::ExecutionSucceededDetails",
    "aws_sdk_lambda::types::_execution_timed_out_details::ExecutionTimedOutDetails",
    "aws_sdk_lambda::types::_invocation_completed_details::InvocationCompletedDetails",
    "aws_sdk_lambda::types::_retry_details::RetryDetails",
    "aws_sdk_lambda::types::_step_failed_details::StepFailedDetails",
    "aws_sdk_lambda::types::_step_started_details::StepStartedDetails",
    "aws_sdk_lambda::types::_step_succeeded_details::StepSucceededDetails",
    "aws_sdk_lambda::types::_wait_cancelled_details::WaitCancelledDetails",
    "aws_sdk_lambda::types::_wait_started_details::WaitStartedDetails",
    "aws_sdk_lambda::types::_wait_succeeded_details::WaitSucceededDetails",
    # `test_util::TestRunnerError` (feature `test-util`) carries the
    # serde_json error of a failed event or output conversion.
    "serde_json::error::Error",
    # `ReplayFilterLayer` implements tracing-subscriber's `Filter` trait, and
    # `init_default_subscriber_with_writer` takes a `MakeWriter`. The types
    # come through `lambda_runtime`'s re-export of tracing-subscriber
    # (`lambda_runtime::tracing::subscriber`), not a direct dependency.
    "tracing_subscriber::layer::Filter",
    "tracing_subscriber::registry::LookupSpan",
    "tracing_subscriber::fmt::writer::MakeWriter",
    "tracing_core::subscriber::Subscriber",
]

# Non-default feature gating the in-process local testing runner
# (`test_util::LocalRunner`). Off by default so the always-on public API and
# dependency graph are unchanged; enable with `--features test-util`.
[features]
test-util = []

# Workspace-level lints inherited by all members.
# Style precedence: rustfmt (definitional) > Rust API Guidelines > clippy judgment.
[workspace.lints.clippy]
all = "deny"
# Groups at lower priority so individual lint overrides take precedence.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow multiple versions of transitive dependencies: the AWS SDK
# ecosystem has not yet converged on single versions for all crates.
multiple_crate_versions = { level = "allow", priority = 1 }
# cargo_common_metadata demands `categories`, and no crates.io category
# fits a durable-execution SDK (there is no workflow/orchestration/
# serverless category; the aws-sdk crates ship without registry metadata
# for the same reason). Keywords are still set voluntarily in [package].
cargo_common_metadata = { level = "allow", priority = 1 }
# `#[must_use]` goes on constructors, builders, futures, consuming
# transformations, conversions (`as_*`, `to_*`, `into_*`) and decisions:
# a value whose drop is almost always a bug. It does not go on a passive
# getter, which returns a field or a read-only view of fields, because
# calling it again gives the same value. It does not go on a function
# whose return type is already must-use, such as `Result`
# (`clippy::double_must_use` rejects that). This lint would ask for the
# attribute on every getter, so it is allowed (#54).
must_use_candidate = { level = "allow", priority = 1 }
# Panic-policy restriction lints (not covered by all/pedantic; added explicitly).
# A panic in the SDK kills the customer's Lambda invocation.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "deny"
unused_qualifications = "warn"
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
tokio = { version = "1.44", features = ["rt", "sync", "time", "macros"] }
lambda_runtime = "1"
# Both AWS crates disable default features so the legacy hyper-0.14 /
# rustls-0.21 / ring chain never enters the graph. `default-https-client`
# selects the modern hyper-1 + rustls-0.23 (aws-lc-rs) client and
# `rt-tokio` supplies the async sleep/timeout implementation the default
# credentials chain and retry timers need. `behavior-version-latest` on
# aws-sdk-lambda lets `Client::new` accept a caller-supplied `SdkConfig`
# that carries no behavior version instead of panicking.
aws-config = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-lambda = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
sha2 = "0.10"

[dev-dependencies]
# Self dev-dependency: enables `test-util` whenever a dev target (unit,
# integration, or doc test) builds, so a plain `cargo test` runs the
# `LocalRunner`-based tests without `--features test-util`. Dev-only, so
# the feature never leaks into a consumer's default build.
aws-durable-execution-sdk = { path = ".", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
aws-smithy-runtime-api = { version = "1", features = ["http-1x"] }
aws-smithy-types = "1"
# Request-mapping tests mock the Lambda SDK client at the HTTP layer.
# `mock_client!` requires the service crate's `test-util` feature; keep
# default features off here so the dev graph matches the production one.
aws-smithy-mocks = "0.3"
# The User-Agent tests send requests through `StaticReplayClient`, which
# records the headers of every attempt.
aws-smithy-http-client = { version = "1", default-features = false, features = ["test-util"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["test-util"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
# A CBOR result serdes in the batch record tests stores the record in a
# binary format.
ciborium = "0.2"

[[test]]
name = "nondeterminism"
required-features = ["test-util"]

[[test]]
name = "serdes_async"
required-features = ["test-util"]

[[test]]
name = "serdes_faults"
required-features = ["test-util"]

[[test]]
name = "replay_logging"
